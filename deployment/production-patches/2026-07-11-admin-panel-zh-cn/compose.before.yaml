services:
  codeapi:
    image: local/librechat-codeapi:office
    pull_policy: never
    container_name: LibreChat-CodeAPI
    init: true
    user: sandbox
    restart: unless-stopped
    cap_drop:
    - ALL
    security_opt:
    - no-new-privileges:true
    mem_limit: 1536m
    memswap_limit: 3072m
    pids_limit: 256
    environment:
      CODEAPI_DATA_DIR: /srv/codeapi-data
      CODEAPI_EXEC_TIMEOUT: '90'
      CODEAPI_MAX_EXEC_TIMEOUT: '180'
      CODEAPI_MAX_UPLOAD_BYTES: '157286400'
      CODEAPI_MAX_ARTIFACT_BYTES: '209715200'
    volumes:
    - /opt/librechat/codeapi-data:/srv/codeapi-data
  admin-panel:
    image: ghcr.io/jetson998/librechat-admin-panel-zh-cn:ca5aa4c17881
    container_name: LibreChat-Admin-Panel
    depends_on:
    - api
    restart: always
    environment:
    - PORT=3000
    - SESSION_SECRET=${ADMIN_PANEL_SESSION_SECRET}
    - API_SERVER_URL=http://api:3080
    - VITE_API_BASE_URL=${DOMAIN_CLIENT:-https://152.32.172.162.sslip.io}
    - SESSION_COOKIE_SECURE=true
  client:
    depends_on:
    - api
    - admin-panel
  api:
    volumes:
    - /opt/librechat/visible-artifact-limit/36d386dc294e-20260722004612/BaseClient.js:/app/api/app/clients/BaseClient.js:ro
    - /opt/librechat/visible-artifact-limit/36d386dc294e-20260722004612/GeneratedArtifactVisibility.js:/app/api/server/services/Files/GeneratedArtifactVisibility.js:ro
    - /opt/librechat/visible-artifact-limit/36d386dc294e-20260722004612/code-process.js:/app/api/server/services/Files/Code/process.js:ro
    - /opt/librechat/generated-files-tab/029799a602eb-20260722031155/user.js:/app/api/server/routes/user.js:ro
    - /opt/librechat/generated-files-tab/029799a602eb-20260722031155/generated-files.js:/app/api/server/routes/generated-files.js:ro
    - /opt/librechat/user-balance-credits/918b2228b667-20260723011842/users.js:/app/api/server/routes/admin/users.js:ro
    - /opt/librechat/user-balance-credits/918b2228b667-20260723011842/admin-balance.js:/app/api/server/routes/admin/admin-balance.js:ro
    - /opt/librechat/user-balance-credits/918b2228b667-20260723011842/usage-dashboard.js:/app/api/server/routes/usage-dashboard.js:ro
    - /opt/librechat/agent-progress-ledger/e46b4b51064f-20260724165803/api-index.cjs:/app/packages/api/dist/index.cjs:ro
    - /opt/librechat/agent-progress-ledger/e46b4b51064f-20260724165803/code-tool-contract.cjs:/app/packages/api/dist/code-tool-contract.cjs:ro
    - /opt/librechat/agent-progress-ledger/e46b4b51064f-20260724165803/tool-call-normalizer.cjs:/app/packages/api/dist/tool-call-normalizer.cjs:ro
    - /opt/librechat/agent-progress-ledger/e46b4b51064f-20260724165803/tool-progress-ledger.cjs:/app/packages/api/dist/tool-progress-ledger.cjs:ro
    - /opt/librechat/agent-category-dedup-count-fix/56b91fa68a8c-20260731044351/client-dist:/app/client/dist:ro
    - /opt/librechat/office-preparse-result-contract-fix/657994b62e45-20260731191021/InitializationFailure.js:/app/api/server/controllers/agents/InitializationFailure.js:ro
    - /opt/librechat/office-preparse-result-contract-fix/657994b62e45-20260731191021/request.js:/app/api/server/controllers/agents/request.js:ro
    - /opt/librechat/office-preparse-result-contract-fix/657994b62e45-20260731191021/OfficePreparse.js:/app/api/server/services/Files/OfficePreparse.js:ro
    environment:
    - USER_USAGE_TIMEZONE=Asia/Singapore
    - USER_USAGE_CURRENCY=USD
    - USER_USAGE_USD_RATE=1
    - USER_USAGE_PRICING_CUTOFF=2026-07-18T12:23:34.480Z
    - USER_USAGE_PRICING_CUTOFF_MODELS=gpt-5.6-sol,claude-fable-5
